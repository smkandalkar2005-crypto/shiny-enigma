<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feedback Form</title>
<style>

body{
font-family: Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:8px;
width:350px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#1e40af;
}

</style>
</head>

<body>

<div class="container">

<h2>Feedback Form</h2>

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter phone number" required>

<label>Feedback</label>
<textarea rows="4" placeholder="Write your feedback"></textarea>

<button type="submit">Submit Feedback</button>

</form>

</div>

</body>
</html>
